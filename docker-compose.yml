services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    user: root
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=todo-app_traefik-net"
      - "--certificatesresolvers.le.acme.email=andrei.repo@gmail.com"
      - "--certificatesresolvers.le.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--log.level=DEBUG"
      - "--accesslog=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme:/acme
    networks:
      - traefik-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=PathPrefix(`/traefik`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=web"

  todo-db:
    image: mongo:4.4
    container_name: todo-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    healthcheck:
      test: |
        mongo --quiet \
        --username ${MONGO_ROOT_USERNAME} \
        --password ${MONGO_ROOT_PASSWORD} \
        --eval "db.adminCommand('ping')"
      interval: 15s
      timeout: 10s
      retries: 5
    volumes:
      - todo-data:/data/db
    networks:
      - traefik-net

  todo-be:
    image: ghcr.io/andreirepo/todo-app/todo-backend:${IMAGE_TAG:-latest}
    container_name: todo-be
    environment:
      NODE_OPTIONS: "--enable-source-maps"
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE}
      MONGO_URI: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@todo-db:27017/todos?authSource=admin"
      BASE_PATH: "/apps/todo"
    ports:
      - "5000:5000"
    depends_on:
      todo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks:
      - traefik-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # entrypoints=web, not websecure: Cloudflare Tunnel delivers plain HTTP to
      # traefik:80 and Cloudflare terminates TLS. Nothing ever reaches the
      # websecure entrypoint, so a router declared on it is simply dead.
      # Priority is explicit because Traefik otherwise ranks routers by rule
      # length, and the portfolio's rule "Host(a) || Host(www)" (52 chars) is
      # longer than a Host+PathPrefix rule (50 for the frontend) — so the
      # portfolio router would win /apps/todo and serve its own 404.
      - "traefik.http.routers.todo-api.rule=Host(`andreirepo.com`) && PathPrefix(`/apps/todo/api`)"
      - "traefik.http.routers.todo-api.entrypoints=web"
      - "traefik.http.routers.todo-api.priority=200"
      - "traefik.http.routers.todo-api.service=todo-api"
      - "traefik.http.routers.todo-api.middlewares=todo-api-strip"
      - "traefik.http.services.todo-api.loadbalancer.server.port=5000"
      - "traefik.http.middlewares.todo-api-strip.stripprefix.prefixes=/apps/todo"

  todo-fe:
    image: ghcr.io/andreirepo/todo-app/todo-frontend:${IMAGE_TAG:-latest}
    container_name: todo-fe
    depends_on:
      todo-be:
        condition: service_healthy
    networks:
      - traefik-net
    restart: unless-stopped
    labels:
      # Behind the tunnel there is no TLS to terminate here and no ACME to run:
      # Cloudflare holds the certificate. The redirect-to-https router that used
      # to sit on the web entrypoint only produced a bounce back into
      # Cloudflare, so it is gone.
      - "traefik.enable=true"
      - "traefik.http.routers.todo-frontend.rule=Host(`andreirepo.com`) && PathPrefix(`/apps/todo`)"
      - "traefik.http.routers.todo-frontend.entrypoints=web"
      - "traefik.http.routers.todo-frontend.priority=100"
      - "traefik.http.routers.todo-frontend.service=todo-frontend"
      - "traefik.http.routers.todo-frontend.middlewares=todo-fe-strip"
      - "traefik.http.services.todo-frontend.loadbalancer.server.port=80"
      - "traefik.http.middlewares.todo-fe-strip.stripprefix.prefixes=/apps/todo"

networks:
  traefik-net:
    driver: bridge

volumes:
  todo-data:
