name: Deploy Todo App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/todo-frontend
  IMAGE_NAME_BACKEND: ${{ github.repository }}/todo-backend

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run linting (if available)
        run: yarn lint || echo "No lint script found"

  build-and-push:
    needs: build-and-test
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/client/Dockerfile
          platforms: linux/amd64
          push: true
          # commit tag is what a rollback targets; latest keeps the plain
          # `docker compose up` path working for anyone without a state file
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            API_URL=/apps/todo/api
            BASE_URL=/apps/todo/
            NODE_ENV=production
          provenance: false
          sbom: false

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  deploy:
    needs: [build-and-test, build-and-push]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Backup current deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} \
            "cd /home/${{ env.SERVER_USER }}/apps/todo-app && \
             docker compose -f docker-compose.yml ps --format json > /tmp/todo-backup-state.json 2>/dev/null || true"

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} \
            "sudo mkdir -p /home/${{ env.SERVER_USER }}/apps/todo-app && \
             sudo chown ${{ env.SERVER_USER }}:${{ env.SERVER_USER }} /home/${{ env.SERVER_USER }}/apps/todo-app && \
             sudo chmod 755 /home/${{ env.SERVER_USER }}/apps/todo-app"

          rsync -az --delete -e "ssh" --exclude='acme/' . \
            ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/home/${{ env.SERVER_USER }}/apps/todo-app/

          # Pull first, write .env second, restart third. If the pull fails the
          # .env still describes the images that are actually on disk, so a
          # stray `docker compose up` cannot try to start a tag that was never
          # fetched.
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} <<'EOF'
            set -eu
            cd /home/${{ env.SERVER_USER }}/apps/todo-app

            # Deploy state lives outside the rsync target: rsync --delete wipes
            # everything inside it on every run, including this file.
            STATE=/home/${{ env.SERVER_USER }}/apps/todo-app-deploy.state
            PREVIOUS_TAG=$(awk -F= '/^IMAGE_TAG=/{print $2}' "$STATE" 2>/dev/null || true)

            # Written before the pull, so that a failed pull or a failed
            # restart still leaves the state knowing what to go back to.
            printf 'IMAGE_TAG=%s\nPREVIOUS_TAG=%s\n' '${{ github.sha }}' "${PREVIOUS_TAG:-}" > "$STATE"

            docker network ls | grep -q todo-app_traefik-net || docker network create todo-app_traefik-net
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          EOF

          # Streamed from the runner rather than built on the server by a
          # nested heredoc: no leading whitespace, and a secret containing a
          # '$' cannot be expanded on the way through.
          cat <<'EOF' | ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} 'cat > /home/${{ env.SERVER_USER }}/apps/todo-app/.env'
          MONGO_ROOT_USERNAME=${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}
          NODE_ENV=production
          UV_THREADPOOL_SIZE=4
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          IMAGE_TAG=${{ github.sha }}
          EOF

          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} 'cd /home/${{ env.SERVER_USER }}/apps/todo-app && docker compose -f docker-compose.yml up -d'

  health-check:
    needs: deploy
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Wait for service to be ready
        run: sleep 30

      - name: Health check
        run: |
          # Assert on the app's own markup, not on the status code. Until the
          # portfolio stopped answering unknown paths with its home page, this
          # check was passing against that home page: /apps/todo returned 200
          # with the wrong body, so a deployment that never reached Traefik
          # still reported success.
          for i in 1 2 3 4 5; do
            echo "Health check attempt $i/5..."
            if curl -sf https://andreirepo.com/apps/todo/ | grep -q 'id="root"'; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1

  rollback:
    # Runs when the deploy or the health check failed. needs.* is required for
    # the expressions below; always() because a skipped health check would
    # otherwise skip this job too.
    needs: [deploy, health-check]
    runs-on: self-hosted
    if: always() && (needs.deploy.result == 'failure' || needs.health-check.result == 'failure')

    steps:
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Roll back to the previous image tag
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # The old version ran `git checkout HEAD~1` — but the deployed
          # directory is an rsync copy, not a clone, so there is no HEAD to
          # check out and the job failed every time it was needed. And even
          # with a repo there, `up -d --build` rebuilds from source instead of
          # restoring a known-good image.
          #
          # What it does now: the deploy step records the tag it is about to
          # run next to the tag it replaced, and this restores the latter.
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} <<'EOF'
            set -eu
            cd /home/${{ env.SERVER_USER }}/apps/todo-app

            STATE=/home/${{ env.SERVER_USER }}/apps/todo-app-deploy.state

            if [ ! -f "$STATE" ]; then
              echo "No deploy state on the server — nothing to roll back to."
              exit 0
            fi

            . "$STATE"

            if [ -z "${PREVIOUS_TAG:-}" ]; then
              echo "No previous image tag recorded — this was the first tagged deploy. Nothing to roll back to."
              exit 0
            fi

            if [ ! -f .env ]; then
              echo "No .env on the server: the deploy did not get that far. Nothing to roll back to."
              exit 0
            fi

            echo "Rolling back from ${IMAGE_TAG:-unknown} to $PREVIOUS_TAG"
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$PREVIOUS_TAG|" .env
            docker compose -f docker-compose.yml up -d

            # Clear the previous tag so a second rollback cannot replay it now
            # that it is the current one.
            printf 'IMAGE_TAG=%s\nPREVIOUS_TAG=\n' "$PREVIOUS_TAG" > "$STATE"
          EOF
